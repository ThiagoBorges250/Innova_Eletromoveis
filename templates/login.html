{% extends 'base.html' %}
{% block title %}Login do administrador{% endblock %}
{% block content %}
<div class="auth-background"><div class="auth-card"><div class="auth-symbol">⌂</div><span class="eyebrow">ACESSO RESTRITO</span><h1>Painel da Innova</h1><p>Entre com o e-mail e senha do administrador cadastrados no Supabase.</p><form method="post" action="{{ url_for('admin.login') }}" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">E-mail</label><input type="email" name="email" id="email" placeholder="admin@exemplo.com" autocomplete="username" required maxlength="254"><label for="senha">Senha</label><input type="password" name="senha" id="senha" placeholder="Sua senha" autocomplete="current-password" required><button class="btn btn-orange btn-full auth-submit" type="submit">Entrar no painel <svg class="icon"><use href="#i-arrow"/></svg></button></form><div class="auth-note">🔒 Autenticação via Supabase Auth + autorização em PostgreSQL.</div><a class="auth-back" href="{{ url_for('shop.index') }}">← Voltar à loja</a></div></div>
{% endblock %}
