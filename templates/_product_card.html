{% macro product_card(produto) %}
<article class="product-card">
  <a href="{{ url_for('shop.product_detail', product_id=produto.id) }}" class="product-photo" aria-label="Ver {{ produto.nome }}">
    <img src="{{ produto.imagem }}" alt="{{ produto.nome }}" loading="lazy" onerror="this.onerror=null;this.src='/static/img/sem-foto.svg'">
    {% if produto.destaque %}<span class="card-badge">Destaque</span>{% endif %}
  </a>
  <div class="card-content">
    <span class="card-category">{{ produto.categoria }}</span>
    <a href="{{ url_for('shop.product_detail', product_id=produto.id) }}" class="card-title">{{ produto.nome }}</a>
    <div class="product-price">{{ produto.preco_centavos | brl }}</div>
    <p class="price-caption">Consulte condições pelo WhatsApp</p>
    <form action="{{ url_for('shop.add_to_cart') }}" method="post" data-add-to-cart>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="produto_id" value="{{ produto.id }}">
      <input type="hidden" name="quantidade" value="1">
      <button class="btn btn-orange btn-full" type="submit" {% if produto.estoque < 1 %}disabled{% endif %}>
        <svg class="icon"><use href="#i-cart"/></svg> {{ 'Adicionar ao carrinho' if produto.estoque > 0 else 'Indisponível' }}
      </button>
    </form>
  </div>
</article>
{% endmacro %}
